name: Build APM Tools

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build APM Overlay
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc APMOverlay.cpp user32.lib gdi32.lib shell32.lib /link /SUBSYSTEM:WINDOWS /OUT:APMOverlay.exe

      - name: Build APM Timeline Visualizer
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc APMTimelineVisualizer.cpp user32.lib gdi32.lib gdiplus.lib /link /SUBSYSTEM:WINDOWS /OUT:APMTimelineVisualizer.exe

      - name: Prepare release files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item APMOverlay.exe release\APMOverlay.exe
          Copy-Item APMTimelineVisualizer.exe release\APMTimelineVisualizer.exe
          Copy-Item image.png release\image.png

      - name: Create APM Tools ZIP
        shell: powershell
        run: |
          Compress-Archive -Path release\* -DestinationPath APM-Tools.zip -Force

      - name: Upload APM Tools ZIP
        uses: actions/upload-artifact@v4
        with:
          name: APM-Tools
          path: APM-Tools.zip
          if-no-files-found: error
