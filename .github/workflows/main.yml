name: Build APM Tools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APM Overlay
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /EHsc APMOverlay.cpp user32.lib gdi32.lib shell32.lib /link /SUBSYSTEM:WINDOWS /OUT:APMOverlay.exe

      - name: Build Timeline Visualizer
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /EHsc APMTimelineVisualizer.cpp user32.lib gdi32.lib windowscodecs.lib ole32.lib /link /SUBSYSTEM:WINDOWS /OUT:APMTimelineVisualizer.exe

      - name: Build PNG to GIF Converter
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /EHsc PNGToGIF.cpp user32.lib gdi32.lib shell32.lib ole32.lib windowscodecs.lib comdlg32.lib /link /SUBSYSTEM:WINDOWS /OUT:PNGToGIF.exe

      - name: Upload APM Tools
        uses: actions/upload-artifact@v4
        with:
          name: APM-Tools
          path: |
            APMOverlay.exe
            APMTimelineVisualizer.exe
            PNGToGIF.exe
