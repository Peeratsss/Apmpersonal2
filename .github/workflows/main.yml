name: Build APM Tools

on:
  workflow_dispatch:
  push:
    paths:
      - 'APMOverlay.cpp'
      - 'APMTimelineVisualizer.cpp'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize MSVC x64
        shell: cmd
        run: call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

      - name: Build APM Overlay
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /EHsc APMOverlay.cpp user32.lib gdi32.lib shell32.lib /link /SUBSYSTEM:WINDOWS /OUT:APMOverlay.exe

      - name: Build Timeline Visualizer
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /EHsc APMTimelineVisualizer.cpp user32.lib gdi32.lib shell32.lib ole32.lib gdiplus.lib /link /SUBSYSTEM:WINDOWS /OUT:APMTimelineVisualizer.exe

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: APM-Tools
          path: |
            APMOverlay.exe
            APMTimelineVisualizer.exe
          if-no-files-found: error
